name: Remove obsolete branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-stale-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete obsolete temporary branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            folder-structure-management-ce7c9 \
            folder-structure-management-flow-test \
            folder-structure-management-live-render-test \
            folder-structure-management-promotion-test \
            folder-structure-management-promotion-test-2 \
            repair-qwen-main-flow \
            verify-cloudflare-readiness \
            verify-cloudflare-starter
          do
            git push origin --delete "$branch" 2>/dev/null || true
          done
