name: Promote AI branches to main

on:
  push:
    branches:
      - 'folder-structure-management-*'

permissions:
  contents: write

concurrency:
  group: promote-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Inspect and rebase the AI update
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main

          merge_base="$(git merge-base origin/main HEAD)"
          changed_files="$(git diff --name-only "$merge_base" HEAD)"
          printf '%s\n' "$changed_files"

          if [[ -z "$changed_files" ]]; then
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
            echo 'The branch is still empty; it will remain available for the AI to push code.'
            exit 0
          fi

          echo 'has_changes=true' >> "$GITHUB_OUTPUT"

          if printf '%s\n' "$changed_files" | grep -Eq '^(\.github/workflows/|wrangler\.(toml|json|jsonc)$|cloudflare-worker/)'; then
            echo 'AI application code may be promoted automatically, but deployment infrastructure requires manual review.' >&2
            exit 1
          fi

          git rebase origin/main

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.has_changes == 'true'
        with:
          node-version: 22

      - if: steps.changes.outputs.has_changes == 'true'
        run: npm install

      - if: steps.changes.outputs.has_changes == 'true'
        run: npm test

      - if: steps.changes.outputs.has_changes == 'true'
        run: npm run check

      - name: Push the verified code directly to main
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main

      - name: Remove the temporary AI branch
        if: success() && steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete "$SOURCE_BRANCH" 2>/dev/null || true